# Unity merges this into the exported Gradle project's gradle.properties.
# Enable: Edit > Project Settings > Player > Android > Publishing Settings > Custom Gradle Properties Template
#
# Longer timeouts can reduce java.util.concurrent.TimeoutException during Gradle (lint, packaging, etc.).
# "Exception while marshalling package.xml / SDK is read-only" is fixed by using a writable Android SDK path
# in Edit > Preferences > External Tools (not the read-only copy under Program Files\Unity\Hub\Editor\...).

org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.workers.max=4

systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
