<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <script>
      // Stripe returns with ?orbit_unlock=success. Keep the signal for the game, then drop it from the address bar.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var flag = params.get("orbit_unlock");
          if (flag !== "success" && flag !== "cancel")
            return;
          sessionStorage.setItem("titanOrbitCheckoutReturn", flag);
          params.delete("orbit_unlock");
          var search = params.toString();
          var clean = window.location.pathname + (search ? "?" + search : "") + window.location.hash;
          history.replaceState(null, "", clean);
        } catch (e) {}
      })();
    </script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Titan Orbit</title>
    <meta name="description" content="Titan Orbit is a multiplayer space game played in the browser. Fly a ship, mine, and fight with other players.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
    <!--
      AdSense H5 Games Ads (Ad Placement API). adBreak and adConfig must exist
      before adsbygoogle.js runs, or Watch Ad pushes into a dead queue.
      preloadAdBreaks is set once, here, before the first adBreak.
    -->
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
      window.TitanOrbitH5AdsReady = false;
      window.TitanOrbitH5ReadyQueue = [];
      window.adConfig({
        preloadAdBreaks: "on",
        sound: "on",
        onReady: function () {
          window.TitanOrbitH5AdsReady = true;
          if (window.console && console.log)
            console.log("[TitanOrbitH5] onReady");
          var waiters = window.TitanOrbitH5ReadyQueue.splice(0);
          for (var i = 0; i < waiters.length; i++) waiters[i]();
        }
      });

      // adsbygoogle.js loads the H5 library only after a site-config message.
      // This publisher's tag never receives that message, so adBreak stays the
      // stub and onReady never fires. One post starts the real library.
      function titanOrbitNudgeH5() {
        if (window.console && console.log)
          console.log("[TitanOrbitH5] adsbygoogle.js loaded; starting H5 library");
        try {
          window.postMessage(JSON.stringify({ googMsgType: "sc-cnf" }), "*");
        } catch (e) {}
      }

      function titanOrbitHideAdTap() {
        var btn = document.getElementById("titan-orbit-ad-tap");
        if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
      }

      // Unity's Watch Ad click is no longer a browser gesture when showAdFn arrives.
      // This DOM button calls showAdFn from a real click so the rewarded video can start.
      function titanOrbitShowAdTap(showAdFn, onFail) {
        titanOrbitHideAdTap();
        var btn = document.createElement("button");
        btn.id = "titan-orbit-ad-tap";
        btn.type = "button";
        btn.textContent = "TAP TO START AD";
        btn.style.cssText = "position:fixed;inset:0;z-index:100000;margin:0;border:0;background:rgba(2,4,10,0.88);color:#f2d56b;font:700 18px/1 sans-serif;letter-spacing:0.12em;cursor:pointer;";
        btn.onclick = function (ev) {
          if (ev && ev.preventDefault) ev.preventDefault();
          if (ev && ev.stopPropagation) ev.stopPropagation();
          titanOrbitHideAdTap();
          try { showAdFn(); }
          catch (e) { if (typeof onFail === "function") onFail(); }
        };
        if (!document.body) return;
        document.body.appendChild(btn);
      }

      function titanOrbitShowAdNote(text) {
        var note = document.getElementById("titan-orbit-ad-note");
        if (!note) {
          note = document.createElement("div");
          note.id = "titan-orbit-ad-note";
          note.style.cssText = "position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:100001;padding:12px 18px;background:rgba(2,4,10,0.94);color:#dce8f5;border:1px solid #3a4a60;font:700 14px/1 sans-serif;letter-spacing:0.08em;pointer-events:none;";
          if (!document.body) return;
          document.body.appendChild(note);
        }
        note.textContent = text;
        note.style.display = "block";
        clearTimeout(note._hide);
        note._hide = setTimeout(function () { note.style.display = "none"; }, 2500);
      }

      // Called from TitanOrbitImaBridge.jslib after the player taps Watch Ad.
      // Unity strings: before | after | complete | skipped | error | no-ad | no-ad:<breakStatus> | sdk-not-loaded
      // Grant only on complete. adBreakDone is the last callback and the one that settles the placement.
      // A real function declaration, not only a window property. Unity's WebGL
      // bridge looks up this name from its own script, and a missing lookup
      // is reported to the game as sdk-not-loaded.
      function TitanOrbitH5RewardedPlay(placementName, onStatus) {
        function report(status) {
          if (typeof onStatus === "function") onStatus(status);
        }

        if (typeof window.adBreak !== "function") {
          window.adsbygoogle = window.adsbygoogle || [];
          window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
        }

        if (window.console && console.log)
          console.log("[TitanOrbitH5] play placement=" + (placementName || "reward")
            + " ready=" + !!window.TitanOrbitH5AdsReady
            + " adBreak=" + typeof window.adBreak);

        titanOrbitRunRewardedBreak(placementName, onStatus);
      }
      window.TitanOrbitH5RewardedPlay = TitanOrbitH5RewardedPlay;

      function titanOrbitRunRewardedBreak(placementName, onStatus) {
        var settled = false;
        var rewardEarned = false;
        var dismissed = false;
        // Safety net only. A normal miss ends in adBreakDone, which is always last.
        var hungTimer = setTimeout(function () {
          settle(rewardEarned ? "complete" : "no-ad:timeout");
        }, 180000);

        function settle(status) {
          if (settled) return;
          settled = true;
          clearTimeout(hungTimer);
          clearTimeout(rewardTimer);
          titanOrbitHideAdTap();
          if (status === "error" || status === "sdk-not-loaded" || status.indexOf("no-ad") === 0)
            titanOrbitShowAdNote("NO AD AVAILABLE");
          if (typeof onStatus === "function") onStatus(status);
        }

        var rewardTimer = setTimeout(function () {
          if (window.console && console.log)
            console.log("[TitanOrbitH5] beforeReward was not called. ready=" + !!window.TitanOrbitH5AdsReady);
          settle("no-ad:notReady");
        }, 8000);

        try {
          window.adBreak({
            type: "reward",
            name: placementName || "reward",
            beforeReward: function (showAdFn) {
              clearTimeout(rewardTimer);
              if (window.console && console.log)
                console.log("[TitanOrbitH5] beforeReward — showing TAP TO START AD");
              titanOrbitShowAdTap(showAdFn, function () { settle("error"); });
            },
            beforeAd: function () {
              if (typeof onStatus === "function") onStatus("before");
            },
            afterAd: function () {
              if (typeof onStatus === "function") onStatus("after");
            },
            adViewed: function () { rewardEarned = true; },
            adDismissed: function () { dismissed = true; },
            adBreakDone: function (info) {
              var breakStatus = info && info.breakStatus;
              if (window.console && console.log)
                console.log("[TitanOrbitH5] placement=" + (placementName || "reward") + " breakStatus=" + breakStatus);
              if (rewardEarned || breakStatus === "viewed") settle("complete");
              else if (dismissed || breakStatus === "dismissed") settle("skipped");
              else settle(breakStatus ? ("no-ad:" + breakStatus) : "no-ad");
            }
          });
        } catch (e) {
          settle("error");
        }
      }
    </script>
    <!--
      Live H5 rewarded inventory for ca-pub-6601000494638397.
      data-adbreak-test is omitted on purpose: that flag plays a sample video and does not earn.
    -->
    <script async data-ad-client="ca-pub-6601000494638397" data-ad-frequency-hint="30s"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6601000494638397"
      crossorigin="anonymous"
      onload="titanOrbitNudgeH5()"
      onerror="console.log('[TitanOrbitH5] adsbygoogle.js failed to load')"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
#if SHOW_DIAGNOSTICS
      <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Watch Ad must call showAdFn before this browser click returns.
      // Unity's button handler runs later, after the gesture has ended, and Google
      // then refuses to open the video. This listener hit-tests the click in Unity
      // while the gesture is still active.
      if (canvas) {
        canvas.addEventListener("pointerdown", function (ev) {
          var host = window.TitanOrbitRewardedHost;
          if (!host || typeof SendMessage !== "function")
            return;
          var rect = canvas.getBoundingClientRect();
          if (rect.width < 1 || rect.height < 1)
            return;
          var nx = (ev.clientX - rect.left) / rect.width;
          var ny = 1 - ((ev.clientY - rect.top) / rect.height);
          if (nx < 0 || nx > 1 || ny < 0 || ny > 1)
            return;
          SendMessage(host, "OnRewardedPointer", nx.toFixed(4) + "," + ny.toFixed(4));
        }, true);
      }

      // [TITAN-ORBIT] SPACE is hold-to-fire. Stop the browser from scrolling the
      // page; the keydown still reaches the Unity canvas.
      window.addEventListener("keydown", function (e) {
        if (e.code === "Space")
          e.preventDefault();
      });

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // [TITAN-ORBIT] Avoid synchronous JS_FileSystem_Sync during Module._main
      // (deprecated path showed up in the WebGL OOB stack window).
      config.autoSyncPersistentDataPath = true;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

      } else {
        // Desktop: fill the browser client area (CSS in TemplateData/style.css).
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
                document.getElementById("diagnostics-icon").onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
                };
#endif

#if DEVELOPMENT_PLAYER
                var profile = unityProfiler.createButton(unityInstance);
                profile.style.marginLeft = '5px';
                document.querySelector("#unity-container").appendChild(profile);

                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-container").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    unityProfiler.shutDown();
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
